global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: mini-cloud-control-plane
    metrics_path: /metrics/control
    authorization:
      type: Bearer
      credentials_file: /run/secrets/control-plane-metrics.token
    static_configs:
      - targets:
          - host.docker.internal:18080

  - job_name: mini-cloud-plane-federation
    honor_labels: true
    metrics_path: /federate
    params:
      match[]:
        - '{__name__=~"minicloud_.*|up"}'
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/*.json
