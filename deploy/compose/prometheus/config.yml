global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: mini-cloud-control-planes
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/*.json

  - job_name: mini-cloud-workload-otel
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:9464
