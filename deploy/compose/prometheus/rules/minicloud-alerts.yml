groups:
  - name: minicloud-slo-recording
    rules:
      - record: minicloud:slo_release_success_24h:global_ratio
        expr: |
          sum(increase(minicloud_deployment_rollout_outcomes_total{result="success"}[24h]))
          /
          clamp_min(sum(increase(minicloud_deployment_rollout_outcomes_total{result="total"}[24h])), 1)

      - record: minicloud:slo_worker_readiness:global_ratio
        expr: |
          sum(minicloud_slo_window_events{id="worker-readiness",result="good"})
          /
          clamp_min(sum(minicloud_slo_window_events{id="worker-readiness",result="total"}), 1)

      - record: minicloud:runtime_node_bootstrap_success_30m:global_ratio
        expr: |
          sum(increase(minicloud_runtime_node_bootstrap_events_total{result="ready"}[30m]))
          /
          clamp_min(sum(increase(minicloud_runtime_node_bootstrap_events_total{result="started"}[30m])), 1)

  - name: minicloud-alerts
    rules:
      - alert: MiniCloudPlaneOffline
        expr: minicloud_control_plane_status{status="offline"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "mini-cloud control 中存在离线 plane"
          description: "plane {{ $labels.name }} ({{ $labels.plane_id }}) 已被 control-plane 标记为 offline。"

      - alert: MiniCloudDeploymentRolloutStuck
        expr: sum by (job, instance) (minicloud_deployments_stuck) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "mini-cloud 存在长时间卡住的 deployment"
          description: "{{ $labels.job }} / {{ $labels.instance }} 上至少有一个 deployment 长时间停留在非终态。"

      - alert: MiniCloudRuntimeNodeBootstrapStuck
        expr: minicloud_runtime_nodes_bootstrap_stuck > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "mini-cloud 存在长时间未完成 bootstrap 的 runtime node"
          description: "{{ $labels.job }} / {{ $labels.instance }} 上至少有一个 runtime node 超过阈值仍停留在 provisioning。"
