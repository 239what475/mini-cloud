syntax = "proto3";

package minicloud.nodeagent.v1;

option go_package = "mini-cloud/internal/gen/proto/minicloud/nodeagent/v1;nodeagentv1";

import "google/protobuf/timestamp.proto";

message RegisterNodeRequest {
  string provider = 1;
  string region = 2;
  string name = 3;
  string private_ip = 4 [json_name = "privateIP"];
  string instance_id = 5 [json_name = "instanceID"];
  string instance_type = 6 [json_name = "instanceType"];
  int32 cpu_milli_total = 7 [json_name = "cpuMilliTotal"];
  int32 memory_mi_total = 8 [json_name = "memoryMiTotal"];
}

message RegisterNodeResponse {
  string node_id = 1 [json_name = "nodeID"];
}

message HeartbeatRequest {
  string node_id = 1 [json_name = "nodeID"];
  int32 cpu_milli_allocatable = 2 [json_name = "cpuMilliAllocatable"];
  int32 memory_mi_allocatable = 3 [json_name = "memoryMiAllocatable"];
}

message HeartbeatResponse {
  string node_id = 1 [json_name = "nodeID"];
  string observed_status = 2 [json_name = "observedStatus"];
}

message WorkItem {
  string execution_id = 1 [json_name = "executionID"];
  string plan_id = 2 [json_name = "planID"];
  string node_id = 3 [json_name = "nodeID"];
  string service_id = 4 [json_name = "serviceID"];
  string service_name = 5 [json_name = "serviceName"];
  string image = 6;
  repeated string command = 7;
  repeated string args = 8;
  map<string, string> env = 9;
  int32 container_port = 10 [json_name = "containerPort"];
  string readiness_path = 11 [json_name = "readinessPath"];
  string container_name = 12 [json_name = "containerName"];
  string action = 13;
  string container_id = 14 [json_name = "containerID"];
  int32 host_port = 15 [json_name = "hostPort"];
}

message PollWorkRequest {
  string node_id = 1 [json_name = "nodeID"];
}

message PollWorkResponse {
  WorkItem item = 1;
}

message ReportExecutionRequest {
  string node_id = 1 [json_name = "nodeID"];
  string execution_id = 2 [json_name = "executionID"];
  string status = 3;
  string reason = 4;
  string container_id = 5 [json_name = "containerID"];
  string container_name = 6 [json_name = "containerName"];
  int32 host_port = 7 [json_name = "hostPort"];
}

message ExecutionRecord {
  string id = 1;
  string plan_id = 2 [json_name = "planID"];
  string node_id = 3 [json_name = "nodeID"];
  string image = 4;
  string container_name = 5 [json_name = "containerName"];
  string container_id = 6 [json_name = "containerID"];
  int32 container_port = 7 [json_name = "containerPort"];
  int32 host_port = 8 [json_name = "hostPort"];
  string readiness_path = 9 [json_name = "readinessPath"];
  string status = 10;
  string status_reason = 11 [json_name = "statusReason"];
  google.protobuf.Timestamp started_at = 12 [json_name = "startedAt"];
  google.protobuf.Timestamp finished_at = 13 [json_name = "finishedAt"];
  google.protobuf.Timestamp created_at = 14 [json_name = "createdAt"];
  google.protobuf.Timestamp updated_at = 15 [json_name = "updatedAt"];
}

message ReportExecutionAck {
  ExecutionRecord execution = 1;
  google.protobuf.Timestamp observed_at = 2 [json_name = "observedAt"];
}

message ReportExecutionResponse {
  ReportExecutionAck ack = 1;
}

service NodeAgentService {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);

  rpc RecordHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  rpc PollWork(PollWorkRequest) returns (PollWorkResponse);

  rpc ReportExecution(ReportExecutionRequest) returns (ReportExecutionResponse);
}
