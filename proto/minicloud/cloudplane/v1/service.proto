syntax = "proto3";

package minicloud.cloudplane.v1;

option go_package = "mini-cloud/internal/gen/proto/minicloud/cloudplane/v1;cloudplanev1";

import "google/protobuf/timestamp.proto";

message ProjectedFileSpec {
  string mount_path = 1 [json_name = "mountPath"];
  string source_kind = 2 [json_name = "sourceKind"];
  string source_id = 3 [json_name = "sourceID"];
  string source_key = 4 [json_name = "sourceKey"];
}

message PersistentDirSpec {
  string name = 1;
  string mount_path = 2 [json_name = "mountPath"];
}

message ServiceSpec {
  string region = 1;
  string instance_class = 3 [json_name = "instanceClass"];
  string image = 4;
  repeated string command = 5;
  repeated string args = 6;
  int32 default_port = 7 [json_name = "defaultPort"];
  string readiness_path = 8 [json_name = "readinessPath"];
  map<string, string> env = 9;
  string config_set_id = 10 [json_name = "configSetID"];
  string secret_set_id = 11 [json_name = "secretSetID"];
  string registry_credential_id = 12 [json_name = "registryCredentialID"];
  string exposure = 13;
  repeated ProjectedFileSpec projected_files = 14 [json_name = "projectedFiles"];
  repeated PersistentDirSpec persistent_dirs = 15 [json_name = "persistentDirs"];
}

message Revision {
  string id = 1;
  string service_id = 2 [json_name = "serviceID"];
  int32 number = 3;
  string label = 4;
  string image = 5;
  repeated string command = 6;
  repeated string args = 7;
  map<string, string> env = 8;
  string registry_credential_id = 9 [json_name = "registryCredentialID"];
  int32 port = 10;
  string readiness_path = 11 [json_name = "readinessPath"];
  google.protobuf.Timestamp created_at = 12 [json_name = "createdAt"];
  string config_set_id = 13 [json_name = "configSetID"];
  string secret_set_id = 14 [json_name = "secretSetID"];
  repeated ProjectedFileSpec projected_files = 15 [json_name = "projectedFiles"];
  repeated PersistentDirSpec persistent_dirs = 16 [json_name = "persistentDirs"];
}
