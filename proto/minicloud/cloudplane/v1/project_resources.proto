syntax = "proto3";

package minicloud.cloudplane.v1;

option go_package = "mini-cloud/internal/gen/proto/minicloud/cloudplane/v1;cloudplanev1";

import "google/protobuf/timestamp.proto";

message QuotaRejectReason {
  string code = 1;
  string message = 2;
  int32 current = 3;
  int32 requested_delta = 4 [json_name = "requestedDelta"];
  int32 projected = 5;
  int32 limit = 6;
}

message QuotaAdmissionRejected {
  repeated QuotaRejectReason reject_reasons = 1 [json_name = "rejectReasons"];
}

message ConfigSet {
  string id = 1;
  string project_id = 2 [json_name = "projectID"];
  string name = 3;
  map<string, string> values = 4;
  google.protobuf.Timestamp created_at = 5 [json_name = "createdAt"];
  google.protobuf.Timestamp updated_at = 6 [json_name = "updatedAt"];
}

message SecretSet {
  string id = 1;
  string project_id = 2 [json_name = "projectID"];
  string name = 3;
  repeated string keys = 4;
  google.protobuf.Timestamp created_at = 5 [json_name = "createdAt"];
  google.protobuf.Timestamp updated_at = 6 [json_name = "updatedAt"];
}

message RegistryCredential {
  string id = 1;
  string project_id = 2 [json_name = "projectID"];
  string name = 3;
  string server = 4;
  string username = 5;
  bool password_configured = 6 [json_name = "passwordConfigured"];
  google.protobuf.Timestamp created_at = 7 [json_name = "createdAt"];
  google.protobuf.Timestamp updated_at = 8 [json_name = "updatedAt"];
}
