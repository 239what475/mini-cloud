syntax = "proto3";

package minicloud.cloudplane.v1;

option go_package = "mini-cloud/internal/gen/proto/minicloud/cloudplane/v1;cloudplanev1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message PlaneSummary {
  string name = 1;
  string provider = 2;
  string region = 3;
}

message PlaneReliability {
  int32 alerts_firing = 1 [json_name = "alertsFiring"];
}

message PlaneNode {
  string node_id = 1 [json_name = "nodeID"];
  string name = 2;
  string provider = 3;
  string region = 4;
  string instance_id = 5 [json_name = "instanceID"];
  string instance_type = 6 [json_name = "instanceType"];
  string status = 7;
  bool schedulable = 8;
  int32 cpu_milli_total = 9 [json_name = "cpuMilliTotal"];
  int32 cpu_milli_allocatable = 10 [json_name = "cpuMilliAllocatable"];
  int32 cpu_milli_allocated = 11 [json_name = "cpuMilliAllocated"];
  int32 memory_mi_total = 12 [json_name = "memoryMiTotal"];
  int32 memory_mi_allocatable = 13 [json_name = "memoryMiAllocatable"];
  int32 memory_mi_allocated = 14 [json_name = "memoryMiAllocated"];
  google.protobuf.Timestamp last_heartbeat_at = 15 [json_name = "lastHeartbeatAt"];
  bool elastic = 16;
}

message PlaneNodeInventory {
  google.protobuf.Timestamp observed_at = 1 [json_name = "observedAt"];
  repeated PlaneNode nodes = 2;
}

message PlaneExecutionSnapshot {
  string plan_id = 1 [json_name = "planID"];
  string service_id = 2 [json_name = "serviceID"];
  string service_name = 3 [json_name = "serviceName"];
  int64 service_generation = 4 [json_name = "serviceGeneration"];
  string status = 5;
  string last_status_reason = 6 [json_name = "lastStatusReason"];
  google.protobuf.Timestamp observed_at = 7 [json_name = "observedAt"];
}

message PlaneSnapshot {
  PlaneSummary plane = 1;
  google.protobuf.Timestamp checked_at = 2 [json_name = "checkedAt"];
  PlaneReliability reliability = 3;
  PlaneNodeInventory node_inventory = 4 [json_name = "nodeInventory"];
  repeated PlaneExecutionSnapshot executions = 5;
}

message ExecutionProjectedFile {
  string mount_path = 1 [json_name = "mountPath"];
  string content = 2;
  uint32 mode = 3;
  bool sensitive = 4;
}

message ExecutionImageCredential {
  string server = 1;
  string username = 2;
  string password = 3;
}

message ApplyExecutionPlanRequest {
  string plan_id = 1 [json_name = "planID"];
  string service_id = 2 [json_name = "serviceID"];
  string service_name = 3 [json_name = "serviceName"];
  int64 service_generation = 4 [json_name = "serviceGeneration"];
  string image = 5;
  repeated string command = 6;
  repeated string args = 7;
  map<string, string> env = 8;
  repeated ExecutionProjectedFile projected_files = 9 [json_name = "projectedFiles"];
  ExecutionImageCredential image_credential = 10 [json_name = "imageCredential"];
  int32 container_port = 11 [json_name = "containerPort"];
  string readiness_path = 12 [json_name = "readinessPath"];
  string instance_class = 13 [json_name = "instanceClass"];
  string exposure = 14;
}

message ApplyExecutionPlanResponse {
  string plan_id = 1 [json_name = "planID"];
}

message DeleteExecutionPlanRequest {
  string service_id = 1 [json_name = "serviceID"];
  int64 service_generation = 2 [json_name = "serviceGeneration"];
  string plan_id = 3 [json_name = "planID"];
}

message DeleteExecutionPlanResponse {
  string service_id = 1 [json_name = "serviceID"];
  bool deleted = 2;
}

service ControlPlaneSnapshotService {
  rpc GetSnapshot(google.protobuf.Empty) returns (PlaneSnapshot);
}

service ControlPlaneExecutionService {
  rpc ApplyExecutionPlan(ApplyExecutionPlanRequest) returns (ApplyExecutionPlanResponse);

  rpc DeleteExecutionPlan(DeleteExecutionPlanRequest) returns (DeleteExecutionPlanResponse);
}
