syntax = "proto3";

package minicloud.cloudplane.v1;

option go_package = "mini-cloud/internal/gen/proto/minicloud/cloudplane/v1;cloudplanev1";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message PlaneSummary {
  string name = 1;
  string provider = 2;
  string region = 3;
  bool configured = 4;
}

message PlaneHealth {
  google.protobuf.Timestamp checked_at = 1 [json_name = "checkedAt"];
  string service = 2;
  string database = 3;
}

message PlaneOverview {
  int32 services_total = 1 [json_name = "servicesTotal"];
  int32 services_deploying = 2 [json_name = "servicesDeploying"];
  int32 services_running = 3 [json_name = "servicesRunning"];
  int32 services_degraded = 4 [json_name = "servicesDegraded"];
  int32 services_failed = 5 [json_name = "servicesFailed"];
  int32 nodes_total = 6 [json_name = "nodesTotal"];
  int32 nodes_registering = 7 [json_name = "nodesRegistering"];
  int32 nodes_ready = 8 [json_name = "nodesReady"];
  int32 nodes_not_ready = 9 [json_name = "nodesNotReady"];
  int32 nodes_draining = 10 [json_name = "nodesDraining"];
  int32 nodes_offline = 11 [json_name = "nodesOffline"];
  int32 execution_plans_total = 12 [json_name = "executionPlansTotal"];
  int32 execution_plans_pending = 13 [json_name = "executionPlansPending"];
  int32 execution_plans_deploying = 14 [json_name = "executionPlansDeploying"];
  int32 execution_plans_running = 15 [json_name = "executionPlansRunning"];
  int32 execution_plans_failed = 16 [json_name = "executionPlansFailed"];
}

message PlaneCapacity {
  int32 runtime_nodes_total = 1 [json_name = "runtimeNodesTotal"];
  int32 runtime_nodes_ready = 2 [json_name = "runtimeNodesReady"];
  int32 cpu_milli_total = 3 [json_name = "cpuMilliTotal"];
  int32 cpu_milli_allocatable = 4 [json_name = "cpuMilliAllocatable"];
  int32 cpu_milli_allocated = 5 [json_name = "cpuMilliAllocated"];
  int32 memory_mi_total = 6 [json_name = "memoryMiTotal"];
  int32 memory_mi_allocatable = 7 [json_name = "memoryMiAllocatable"];
  int32 memory_mi_allocated = 8 [json_name = "memoryMiAllocated"];
}

message PlaneReliability {
  int32 alerts_firing = 1 [json_name = "alertsFiring"];
}

message PlaneRuntimeNode {
  string node_id = 1 [json_name = "nodeID"];
  int64 node_epoch = 2 [json_name = "nodeEpoch"];
  string name = 3;
  string provider = 4;
  string region = 5;
  string instance_id = 6 [json_name = "instanceID"];
  string instance_type = 7 [json_name = "instanceType"];
  string status = 8;
  bool schedulable = 9;
  int32 cpu_milli_total = 10 [json_name = "cpuMilliTotal"];
  int32 cpu_milli_allocatable = 11 [json_name = "cpuMilliAllocatable"];
  int32 cpu_milli_allocated = 12 [json_name = "cpuMilliAllocated"];
  int32 memory_mi_total = 13 [json_name = "memoryMiTotal"];
  int32 memory_mi_allocatable = 14 [json_name = "memoryMiAllocatable"];
  int32 memory_mi_allocated = 15 [json_name = "memoryMiAllocated"];
  google.protobuf.Timestamp last_heartbeat_at = 16 [json_name = "lastHeartbeatAt"];
}

message PlaneRuntimeInventory {
  int64 sync_version = 1 [json_name = "syncVersion"];
  google.protobuf.Timestamp observed_at = 2 [json_name = "observedAt"];
  repeated PlaneRuntimeNode nodes = 3;
}

message PlaneRuntimeConfig {
  google.protobuf.Timestamp observed_at = 1 [json_name = "observedAt"];
  string fingerprint = 2;
  google.protobuf.Struct summary = 3;
}

message PlaneExecutionSnapshot {
  string plan_id = 1 [json_name = "planID"];
  string service_id = 2 [json_name = "serviceID"];
  string service_name = 3 [json_name = "serviceName"];
  int64 service_generation = 4 [json_name = "serviceGeneration"];
  string status = 5;
  string last_status_reason = 6 [json_name = "lastStatusReason"];
  google.protobuf.Timestamp observed_at = 7 [json_name = "observedAt"];
}

message PlaneSnapshot {
  PlaneSummary plane = 1;
  PlaneHealth health = 2;
  PlaneOverview overview = 3;
  PlaneCapacity capacity = 4;
  PlaneReliability reliability = 5;
  PlaneRuntimeInventory runtime_inventory = 7 [json_name = "runtimeInventory"];
  PlaneRuntimeConfig runtime_config = 8 [json_name = "runtimeConfig"];
  repeated PlaneExecutionSnapshot executions = 9;
}

message ExecutionProjectedFile {
  string mount_path = 1 [json_name = "mountPath"];
  string content = 2;
  uint32 mode = 3;
  bool sensitive = 4;
}

message ExecutionImageCredential {
  string server = 1;
  string username = 2;
  string password = 3;
}

message ApplyExecutionPlanRequest {
  string plan_id = 1 [json_name = "planID"];
  string service_id = 2 [json_name = "serviceID"];
  string service_name = 3 [json_name = "serviceName"];
  int64 service_generation = 4 [json_name = "serviceGeneration"];
  string image = 5;
  repeated string command = 6;
  repeated string args = 7;
  map<string, string> env = 8;
  repeated ExecutionProjectedFile projected_files = 9 [json_name = "projectedFiles"];
  ExecutionImageCredential image_credential = 11 [json_name = "imageCredential"];
  int32 container_port = 12 [json_name = "containerPort"];
  string readiness_path = 13 [json_name = "readinessPath"];
  string instance_class = 14 [json_name = "instanceClass"];
  string exposure = 15;
}

message ApplyExecutionPlanResponse {
  string action = 1;
  string plan_id = 2 [json_name = "planID"];
}

message DeleteExecutionPlanRequest {
  string service_id = 1 [json_name = "serviceID"];
  int64 service_generation = 2 [json_name = "serviceGeneration"];
  string plan_id = 3 [json_name = "planID"];
}

message DeleteExecutionPlanResponse {
  string service_id = 1 [json_name = "serviceID"];
  bool deleted = 2;
}

service ControlPlaneSnapshotService {
  rpc GetSnapshot(google.protobuf.Empty) returns (PlaneSnapshot);
}

service ControlPlaneExecutionService {
  rpc ApplyExecutionPlan(ApplyExecutionPlanRequest) returns (ApplyExecutionPlanResponse);

  rpc DeleteExecutionPlan(DeleteExecutionPlanRequest) returns (DeleteExecutionPlanResponse);
}
